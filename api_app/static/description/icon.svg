<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c5282;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d69e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ecc94b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="128" height="128" rx="16" fill="url(#grad1)"/>
  
  <!-- Building icon -->
  <g transform="translate(24, 20)">
    <!-- Main building -->
    <rect x="20" y="30" width="40" height="58" fill="#fff" opacity="0.95"/>
    
    <!-- Roof -->
    <polygon points="10,30 40,8 70,30" fill="url(#grad2)"/>
    
    <!-- Door -->
    <rect x="32" y="60" width="16" height="28" fill="#2c5282"/>
    <circle cx="44" cy="74" r="2" fill="#d69e2e"/>
    
    <!-- Windows -->
    <rect x="26" y="38" width="10" height="10" fill="#2c5282"/>
    <rect x="44" y="38" width="10" height="10" fill="#2c5282"/>
    <rect x="26" y="52" width="10" height="10" fill="#2c5282"/>
    <rect x="44" y="52" width="10" height="10" fill="#2c5282"/>
    
    <!-- Columns -->
    <rect x="12" y="30" width="4" height="58" fill="#fff" opacity="0.8"/>
    <rect x="64" y="30" width="4" height="58" fill="#fff" opacity="0.8"/>
  </g>
  
  <!-- API symbol -->
  <g transform="translate(85, 85)">
    <circle cx="15" cy="15" r="18" fill="url(#grad2)"/>
    <text x="15" y="21" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a365d" text-anchor="middle">API</text>
  </g>
</svg>
